<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafbfc;--fg:#12161c;--muted:#566070;--line:#dfe4ea;--card:rgba(255,255,255,.75);--accent:#1f4e8c;--glow:rgba(31,78,140,.14);--glow2:rgba(20,150,170,.12);--dot:rgba(18,22,28,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1014;--fg:#eef1f5;--muted:#98a2b0;--line:#252b34;--card:rgba(22,27,34,.7);--accent:#7fb0ee;--glow:rgba(80,140,230,.18);--glow2:rgba(40,200,210,.10);--dot:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#0d1014;--fg:#eef1f5;--muted:#98a2b0;--line:#252b34;--card:rgba(22,27,34,.7);--accent:#7fb0ee;--glow:rgba(80,140,230,.18);--glow2:rgba(40,200,210,.10);--dot:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
background:
radial-gradient(600px 400px at 85% 10%,var(--glow),transparent 70%),
radial-gradient(500px 400px at 5% 95%,var(--glow2),transparent 70%),
radial-gradient(var(--dot) 1px,transparent 1.5px) 0 0/28px 28px;
-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.shapes{position:fixed;right:-80px;top:50%;width:min(620px,90vw);transform:translateY(-50%);z-index:0;pointer-events:none;color:var(--accent);opacity:.5}
.float{animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
main{position:relative;z-index:1;width:100%;max-width:560px;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--accent);margin-bottom:28px;backdrop-filter:blur(8px);box-shadow:0 6px 20px var(--glow)}
.badge svg,.mail svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:clamp(44px,9vw,72px);font-weight:600;letter-spacing:-.035em;line-height:1.02;margin:0 0 10px}
.role{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--accent);font-weight:500;margin:0 0 24px}
.role::before{content:"";width:28px;height:2px;background:var(--accent);border-radius:2px}
.desc{font-size:18px;color:var(--muted);margin:0 0 40px}
.contact{display:inline-flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);backdrop-filter:blur(8px);text-decoration:none;color:var(--fg);transition:.2s}
.contact:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--glow)}
.mail{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--bg)}
.contact small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.contact b{font-weight:500;font-size:17px;word-break:break-all}
.arrow{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.contact:hover .arrow{stroke:var(--accent);transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<svg class="shapes" viewBox="0 0 600 600" fill="none" stroke="currentColor" aria-hidden="true">
  <g class="float" stroke-width="1.2">
    <circle cx="360" cy="300" r="220" opacity=".25"/>
    <circle cx="360" cy="300" r="150" opacity=".35" stroke-dasharray="4 8"/>
    <rect x="250" y="190" width="220" height="220" rx="28" opacity=".3" transform="rotate(18 360 300)"/>
    <path d="M200 420 L360 130 L520 420 Z" opacity=".25"/>
    <circle cx="360" cy="130" r="6" fill="currentColor" stroke="none" opacity=".7"/>
    <circle cx="200" cy="420" r="6" fill="currentColor" stroke="none" opacity=".7"/>
    <circle cx="520" cy="420" r="6" fill="currentColor" stroke="none" opacity=".7"/>
  </g>
</svg>
<main>
  <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></div>
  <h1>Victor</h1>
  <p class="role">Software Developer</p>
  <p class="desc">Software developer specializing in cross-platform mobile and web applications. I deliver scalable, maintainable solutions with a strong emphasis on code quality, performance, and user-centered design.</p>
  <a class="contact" href="mailto:ephraimvictor21@gmail.com">
    <span class="mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
    <span><small>Contact</small><b>ephraimvictor21@gmail.com</b></span>
    <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</main>
</body>
</html>
